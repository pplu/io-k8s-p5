# Maintained allowlist for maint/crd-drift-check.pl.
#
# The CRD analog of maint/spec-drift-exceptions.yaml. Every entry here is a
# deliberate, already-made decision -- not a TODO. New entries should say
# *why* and reference the karr ticket or Changes bullet that made the call
# (this file was seeded under k82). This file is read as-is on every run;
# there is no merge with built-in defaults, so removing an entry immediately
# surfaces whatever it was hiding.
#
# Matching: GVK-level entries (ignore_missing_kinds, ignore_stale_kinds)
# match on an exact "group/version/Kind" `gvk`; field-level entries
# (ignore_missing_fields, ignore_extra_fields) additionally match `field`.
# An optional `provider` narrows an entry to one provider (omit it to match
# in any provider). No globs, no regex.

# Upstream GVKs the providers deliberately do not ship a class for.
#
# GatewayAPI (k95, task B-GatewayAPI): the standard-channel manifests at
# v1.6.1 list a v1alpha2 or v1alpha3 entry inside the multi-version CRDs for
# TCPRoute, UDPRoute, TLSRoute and BackendTLSPolicy, but every one of them
# has `served: false` -- upstream graduated each to v1 and left the old
# schema in the manifest only for conversion/history, the apiserver never
# serves it, and IO::K8s::CRD->generate (served_versions) already skips
# them. These five entries exist only because maint/crd-drift-check.pl's
# parse_crds reads every versions[] entry regardless of served (Phase A,
# frozen), so an unserved-but-listed version would otherwise misreport as a
# missing Kind; there is nothing to model. (v1beta1 Gateway/GatewayClass/
# HTTPRoute WAS a third case here before k95 -- those three ARE served at
# v1beta1 and now have real classes at lib/IO/K8s/GatewayAPI/V1beta1/,
# reachable via their domain-qualified resource_map keys; satisfied,
# removed. See lib/IO/K8s/GatewayAPI.pm.)
ignore_missing_kinds:
  - provider: GatewayAPI
    gvk: gateway.networking.k8s.io/v1alpha2/TCPRoute
    reason: "k95: served: false at v1.6.1 (graduated to v1); nothing upstream serves to model"
  - provider: GatewayAPI
    gvk: gateway.networking.k8s.io/v1alpha2/UDPRoute
    reason: "k95: served: false at v1.6.1 (graduated to v1); nothing upstream serves to model"
  - provider: GatewayAPI
    gvk: gateway.networking.k8s.io/v1alpha2/TLSRoute
    reason: "k95: served: false at v1.6.1 (graduated to v1); nothing upstream serves to model"
  - provider: GatewayAPI
    gvk: gateway.networking.k8s.io/v1alpha3/TLSRoute
    reason: "k95: served: false at v1.6.1 (graduated to v1); nothing upstream serves to model"
  - provider: GatewayAPI
    gvk: gateway.networking.k8s.io/v1alpha3/BackendTLSPolicy
    reason: "k95: served: false at v1.6.1 (graduated to v1); nothing upstream serves to model"

# Shipped GVKs (resource_map classes) intentionally kept with no matching
# upstream CRD at the pinned upstream_version: back-compat tracks for
# clusters still running an older provider release. Without these, every run
# re-reports the same settled decisions.
#
# Cilium (k78): the v2alpha1 BGP/CIDR tracks were superseded by v2 and two
# Kinds were REMOVED from upstream entirely -- CiliumBGPPeeringPolicy and
# CiliumExternalWorkload. Their classes are kept, reachable only by their
# domain-qualified resource_map keys, so older Cilium clusters still round-
# trip. Documented in lib/IO/K8s/Cilium.pm. (The surviving v2alpha1 BGP/CIDR
# Kinds are NOT stale: upstream v1.20 still serves them as extra versions of
# the v2 CRDs, so they match normally.)
#
# AgentSandbox (k88): the pin moved from v0.5.4 to v1.0.0, a MAJOR upstream
# bump that REMOVED the entire v1alpha1 track -- all four CRDs (Sandbox,
# SandboxClaim, SandboxTemplate, SandboxWarmPool) now serve v1beta1 only. The
# four v1alpha1 classes are kept as a back-compat superset for clusters still
# on agent-sandbox v0.5.x, reachable only by their domain-qualified
# resource_map keys, so those clusters still round-trip. Documented in
# lib/IO/K8s/AgentSandbox.pm. (v1beta1 is unchanged by the bump and matches
# upstream v1.0.0 exactly.)
ignore_stale_kinds:
  - provider: Cilium
    gvk: cilium.io/v2/CiliumExternalWorkload
    reason: "k78: removed from upstream Cilium; class kept for older clusters via its domain-qualified key"
  - provider: Cilium
    gvk: cilium.io/v2alpha1/CiliumBGPPeeringPolicy
    reason: "k78: removed from upstream Cilium; class kept for older clusters via its domain-qualified key"
  - provider: AgentSandbox
    gvk: agents.x-k8s.io/v1alpha1/Sandbox
    reason: "k88: v1alpha1 removed upstream at agent-sandbox v1.0.0; class kept for clusters still on v0.5.x"
  - provider: AgentSandbox
    gvk: extensions.agents.x-k8s.io/v1alpha1/SandboxClaim
    reason: "k88: v1alpha1 removed upstream at agent-sandbox v1.0.0; class kept for clusters still on v0.5.x"
  - provider: AgentSandbox
    gvk: extensions.agents.x-k8s.io/v1alpha1/SandboxTemplate
    reason: "k88: v1alpha1 removed upstream at agent-sandbox v1.0.0; class kept for clusters still on v0.5.x"
  - provider: AgentSandbox
    gvk: extensions.agents.x-k8s.io/v1alpha1/SandboxWarmPool
    reason: "k88: v1alpha1 removed upstream at agent-sandbox v1.0.0; class kept for clusters still on v0.5.x"

# Upstream spec fields a modeled class deliberately omits.
ignore_missing_fields: []

# Modeled spec fields a class ships that the current upstream CRD lacks:
# fields kept for older provider releases, or upstream-removed fields kept
# for back-compat.
ignore_extra_fields: []

# --check's NOT RENDERED status (A3, k95): a file under
# lib/IO/K8s/<Provider>/ that --render's current pass does not produce --
# typically a back-compat class for a GVK already excused above via
# ignore_stale_kinds, whose upstream CRD is gone so there is nothing left
# to render it from. `path` is lib/-relative
# ("IO/K8s/<Provider>/<Version>/<File>.pm"), matching what --check itself
# reports. Empty until a provider's Phase B task actually converts it to
# full-depth rendering and finds a kept file the render legitimately can't
# reproduce.
#
# Cilium (task B-Cilium, k95): CiliumExternalWorkload and
# CiliumBGPPeeringPolicy are the two ignore_stale_kinds back-compat classes
# above (k78) -- their upstream CRDs are gone, so --render has nothing left
# to reproduce them from; both stay hand-checked-in as-is.
#
# AgentSandbox (task B-AgentSandbox, k95, D7): the entire v1alpha1 track
# (Sandbox, SandboxClaim, SandboxTemplate, SandboxWarmPool) is the
# ignore_stale_kinds back-compat superset above (k88) -- upstream v1.0.0
# ships no v1alpha1 manifest at all (no api/v1alpha1 directory in the repo
# at this tag) to render from, so all four stay hand-checked-in as-is.
ignore_unrendered:
  - provider: Cilium
    path: IO/K8s/Cilium/V2/CiliumExternalWorkload.pm
    reason: "k78: removed from upstream Cilium; class kept for older clusters via its domain-qualified key, nothing left upstream to render it from"
  - provider: Cilium
    path: IO/K8s/Cilium/V2alpha1/CiliumBGPPeeringPolicy.pm
    reason: "k78: removed from upstream Cilium; class kept for older clusters via its domain-qualified key, nothing left upstream to render it from"
  - provider: AgentSandbox
    path: IO/K8s/AgentSandbox/V1alpha1/Sandbox.pm
    reason: "k88: v1alpha1 removed upstream at agent-sandbox v1.0.0 (no api/v1alpha1 manifest left to render from); class kept for clusters still on v0.5.x"
  - provider: AgentSandbox
    path: IO/K8s/AgentSandbox/V1alpha1/SandboxClaim.pm
    reason: "k88: v1alpha1 removed upstream at agent-sandbox v1.0.0 (no api/v1alpha1 manifest left to render from); class kept for clusters still on v0.5.x"
  - provider: AgentSandbox
    path: IO/K8s/AgentSandbox/V1alpha1/SandboxTemplate.pm
    reason: "k88: v1alpha1 removed upstream at agent-sandbox v1.0.0 (no api/v1alpha1 manifest left to render from); class kept for clusters still on v0.5.x"
  - provider: AgentSandbox
    path: IO/K8s/AgentSandbox/V1alpha1/SandboxWarmPool.pm
    reason: "k88: v1alpha1 removed upstream at agent-sandbox v1.0.0 (no api/v1alpha1 manifest left to render from); class kept for clusters still on v0.5.x"
